name: Supabase keep-alive

# O plano gratuito do Supabase pausa projetos após ~1 semana sem acessos.
# Este workflow "visita" o banco 2x por semana para mantê-lo ativo.
# A anon key abaixo é pública por design (é a mesma embutida no site).

on:
  schedule:
    - cron: "0 12 * * 1,4" # segundas e quintas, 12:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Ping Supabase
        run: |
          curl -sf "https://kvzvcyhnuynqpvdefess.supabase.co/rest/v1/cases?select=id&limit=1" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt2enZjeWhudXlucXB2ZGVmZXNzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwNDg3MzIsImV4cCI6MjA5NjYyNDczMn0.ToTQsQ5i_OsJhZmDubnmfoMQxzRJxklLh3HNWsJPyvc" \
            > /dev/null
          echo "Supabase respondeu — projeto ativo."

      # O GitHub desativa agendamentos em repositórios parados há 60 dias;
      # este commit periódico mantém o agendamento vivo.
      - name: Keep workflow alive
        run: |
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last-keepalive
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/last-keepalive
          git commit -m "chore: supabase keep-alive" || exit 0
          git push
